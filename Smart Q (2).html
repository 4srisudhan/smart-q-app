button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.stage{height:100%;display:grid;place-items:center}
.phone{position:relative;width:min(390px,100%);height:min(800px,100%);background:var(--bg);overflow:hidden;overflow:clip;border-radius:32px;box-shadow:0 0 0 8px var(--navy),0 24px 60px rgba(11,18,32,.35)}

.scr.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

.ico{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--blue);display:grid;place-items:center;flex:none}
h3{font-size:14px;font-weight:700}
.sp{display:flex;justify-content:space-between;align-items:center}
.big-tok{text-align:center;padding:20px 14px}

.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green);margin-bottom:14px}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stats .card{margin:0;text-align:center;padding:10px 4px}
.stats b{display:block;font-size:20px;margin-top:2px}
.warn{display:flex;gap:10px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.5);border-radius:12px;padding:12px;margin-bottom:12px;font-size:12px}

.tl{position:relative;padding-left:30px}
.tl .it{position:relative;padding-bottom:22px}
.tl .it::before{content:"";position:absolute;left:-23px;top:14px;bottom:-4px;width:2px;background:var(--line);transform-origin:top;animation:grow .5s calc(var(--i)*120ms) both}
.tl .it:last-child::before{display:none}
.tl .nd{position:absolute;left:-30px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--silver)}

.ln{background:none;color:var(--blue);font-size:12px;font-weight:600}

.lk{background:none;color:var(--blue);font-size:inherit;text-decoration:underline;padding:0}

.tag.ok{background:rgba(22,163,74,.14);color:var(--green)}.tag.mutd{background:var(--line);color:var(--mut)}
.sw{width:46px;height:28px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .2s}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}.sw.on{background:var(--blue)}.sw.on i{transform:translateX(18px)}
details.card{padding:0}details summary{padding:14px;font-weight:700;font-size:13px;cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}details p{padding:0 14px 14px;font-size:13px;color:var(--mut);line-height:1.5}
.role{display:flex;align-items:center;gap:12px;width:100%;transition:border-color .2s}.role:hover{border-color:var(--blue)}
@keyframes sweep{from{top:18%}to{top:80%}}
.vf{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--navy)}
.vf video{width:100%;height:100%;object-fit:cover;display:block}
.cn{position:absolute;width:36px;height:36px;border:4px solid #fff}
.cn.a{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.cn.b{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}

.sl{position:absolute;left:14%;right:14%;height:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 14px var(--blue);animation:sweep 2s ease-in-out infinite alternate}
.qr{background:#fff;padding:12px;border-radius:12px;width:190px;margin:0 auto;color:#0B1220;font-size:12px}.qr svg{display:block;width:100%;height:auto}
.mapbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--soft)}
.mapbox svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}.pin:focus-visible{outline:none}.pin:focus-visible circle:first-child{stroke-width:5}
@keyframes ring{from{transform:scale(1);opacity:.5}to{transform:scale(3.2);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-28}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s infinite}
.route{stroke-dasharray:8 6;animation:dash 1s linear infinite}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;transition:background .2s,color .2s}
.chip.act{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.seg button{display:grid;gap:2px;justify-items:center;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:11px;color:var(--mut);transition:background .2s,border-color .2s}
.seg button b{font-size:14px;color:var(--tx)}
.seg button.act{border-color:var(--blue);background:var(--soft)}.seg button.act b{color:var(--blue)}
.msg{font-size:12px;background:var(--soft);border-radius:10px;padding:10px 12px}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.avw{position:relative;flex:none;border-radius:50%}
.cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
#nm{gap:8px}#nm h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni{flex:1;min-width:0;height:34px;border:1px solid var(--blue);border-radius:8px;padding:0 8px;background:var(--card);outline:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

const DAY=864e5;
function subState(){const s=D.sub,left=s.until-Date.now();if(s.status==="none")return{k:"none",on:false};if(left<=0)return{k:"expired",on:false,days:0,was:s.status};return{k:s.status,on:true,days:Math.ceil(left/DAY)}}
const subOn=()=>subState().on;
const planTag=()=>{const k=subState().k;return k==="trial"?"FREE TRIAL":k==="active"?"PREMIUM":"FREE PLAN"};
function startTrial(){const n=Date.now();D.sub={status:"trial",start:n,until:n+3*DAY,auto:true};save()}
function subOp(k){const n=Date.now(),s=D.sub;
if(k==="trial"&&s.status==="none"){startTrial();toast("Your 3-day free trial has started")}
else if(k==="pay"){D.sub={status:"active",start:n,until:n+30*DAY,auto:true};toast("Demo mode: no money was charged")}
else if(k==="cancel"){s.auto=false;toast("Renewal turned off")}
else if(k==="renew"){s.auto=true;toast("Renewal turned on")}
save();rerender()}
function lockCard(name){return `<div class="card rise" style="--i:1;text-align:center;padding:28px 14px"><h3>${name} is a Premium feature</h3><p class="mut" style="margin:6px 0 16px">Start your 3-day free trial or subscribe for ₹25 per month.</p><button class="btn b1" data-go="plans">View plans</button></div>`}
const dist=sh=>km(M,sh)*1.3;
function travelTxt(sh){const d=dist(sh);return fmtD(d)+" away · "+fmtT(eta(d,5))+" walk · "+fmtT(eta(d,28))+" by car"}
function locBar(){return `<div class="sp rise" style="margin-bottom:10px"><span class="mut">${M.real?"Using your live location":"Demo location"}</span><button class="ln" data-locate>Use my location</button></div>`}
function nearby(){const ic2={Hospital:"plus",Bank:"bank","Gov Office":"gov","Ration Shop":"cart"};return MS.map((s,i)=>({s,i,d:dist(s)})).sort((a,b)=>a.d-b.d).slice(0,2).map((x,k)=>`<button class="card row rise" style="--i:${10+k};margin-top:10px" data-near="${x.i}"><span class="ico">${ic(ic2[x.s.t]||"pin",18)}</span><div style="flex:1"><h3 style="font-size:13px">${x.s.n}</h3><p class="mut">${x.s.t} · ${fmtD(x.d)}</p></div><b style="color:var(--blue);font-size:13px">${fmtT(eta(x.d,5))} walk</b></button>`).join("")}
function travelCard(t){const sh=MS.find(x=>x.code===D.code);
if(!subOn())return `<div class="card rise" style="--i:3"><div class="sp"><div><h3>Leave on time</h3><p class="mut">Travel time reminders are Premium</p></div><button class="ln" data-go="plans">View plans</button></div></div>`;
const d=dist(sh),tm=eta(d,MODES[M.mode][1]);
const msg=t.ahead===0?"It is your turn. Head to the counter now.":tm>=t.wait?"Leave now. The trip takes "+fmtT(tm)+" and your turn is in about "+t.wait+" min.":"Leave in "+(t.wait-tm)+" min to arrive as your turn comes.";
return `<div class="card rise" style="--i:3"><div class="sp"><h3>Leave on time</h3><span class="mut">${fmtD(d)} · ${fmtT(tm)} ${MODES[M.mode][0].toLowerCase()}</span></div><p class="msg" style="margin-top:10px">${msg}</p><p class="mut" style="margin-top:8px">${M.real?"Using your live location.":"Using a demo location."} <button class="ln" data-locate>Use my location</button></p></div>`}
function T(){const q=D.token&&QS[D.code];if(!q)return null;const i=q.list.indexOf(D.token);if(i<0)return null;return{q,i,ahead:i,serving:q.list[0],wait:Math.round(i*q.avg),prog:D.p0>0?Math.max(0,Math.min(100,Math.round((D.p0-i)/D.p0*100))):100}}
function emptyCard(){return `<div class="card rise" style="--i:1;text-align:center;padding:28px 14px"><h3>No active ticket</h3><p class="mut" style="margin:6px 0 16px">Join a queue to get your digital token.</p><button class="btn b1" data-go="select">Get a Token</button></div>`}
function heroHtml(){const t=T();if(!t)return `<div class="hero rise" style="--i:2"><span class="tag">NO ACTIVE TICKET</span><h3 style="font-size:15px;margin-top:10px">You are not in a queue</h3><p style="font-size:11px;opacity:.85">Get a token or scan a shop QR code to join.</p></div>`;
const s=MS.find(x=>x.code===D.code);return `<div class="hero rise" style="--i:2"><div class="sp"><span class="tag">ACTIVE TICKET</span><span style="font-size:11px">Est. ${t.wait} min</span></div><div class="sp" style="margin-top:10px"><div><h3 style="font-size:15px">${esc(D.at)}</h3><p style="font-size:11px;opacity:.85">${s.t}</p></div><span class="tok">${D.token}</span></div><div class="sp" style="font-size:12px;margin-top:10px"><span>Serving Current: ${t.serving}</span><b>${t.ahead===0?"Your turn":t.ahead+(t.ahead===1?" person":" people")+" ahead"}</b></div></div>`}
function pushN(a,b,c,silent){D.ntf.unshift([a,"just now",b,c]);if(D.ntf.length>20)D.ntf.length=20;if(!silent)toast(a)}
function joinShop(code){const s=MS.find(x=>x.code===code),q=QS[code];
if(!q.open){toast("This queue is paused right now");return"closed"}
if(D.token&&D.code===code&&q.list.includes(D.token))return"dup";
if(D.token&&QS[D.code]){finishTicket("Left");QS[D.code].list=QS[D.code].list.filter(x=>x!==D.token)}
q.n++;D.token="A-"+q.n;q.list.push(D.token);D.code=code;D.at=s.n;D.p0=q.list.length-1;D.joined++;D.joinedAt=Date.now();save();
pushN("Queue Started Notification","You have joined "+s.n+" queue. Estimated wait is "+Math.round(D.p0*q.avg)+" min.","info",true);return"ok"}
function leaveQueue(){if(D.token&&QS[D.code]){finishTicket("Left");QS[D.code].list=QS[D.code].list.filter(x=>x!==D.token)}D.token=null}
function notifyCustomer(t0){const t=T();
if(t0&&!t){finishTicket("Completed");D.token=null;D.completed++;save();pushN("Service Completed Notification","Your session at "+D.at+" is now complete. Thank you!","check");return}
if(t0&&t&&t.i!==t0.i&&t.i<=2&&subOn()&&D.set.alerts)pushN(t.i===0?"It is your turn":"Token Approaching Alert",t.i===0?"Your Token "+D.token+" is being called at "+D.at+". Please go to the counter.":"Your Token "+D.token+" is only "+t.i+(t.i===1?" person":" persons")+" away. Please head to the queue area.",t.i===0?"check":"alert")}
function qOp(k,v){const t0=T();
if(k==="next"){if(!SQ.list.length)return toast("No one is waiting");SQ.list.shift();SQ.done++;toast(SQ.list.length?"Now serving "+SQ.list[0]:"Queue is empty")}
else if(k==="add"){SQ.n++;SQ.list.push("A-"+SQ.n);toast("Added A-"+SQ.n)}
else if(k==="avg"){SQ.avg=Math.max(1,Math.min(30,Math.round(SQ.avg)+v))}
else{SQ.open=!SQ.open;toast(SQ.open?"Queue is open":"Queue is paused")}
notifyCustomer(t0);rerender()}

login:()=>`<button class="ib rise" data-go="welcome" aria-label="Back to role selection">${ic("back")}</button><h1 class="big rise" style="margin-top:20px">Let’s get started</h1><p class="mut rise" style="--i:1;margin-bottom:22px">Create an account or login to manage your digital tokens instantly.</p>
<p class="mut rise" style="--i:2;margin-bottom:6px;font-weight:600">Phone Number or Email</p><div class="field rise" style="--i:2">${ic("user",18)}<input id="lg-contact" type="text" placeholder="Phone number or email" autocomplete="username" aria-label="Phone number or email"><button type="button" class="ln" data-auth="send">Send code</button></div>
<div class="sp rise" style="--i:3;margin-bottom:8px"><span class="mut" style="font-weight:600">One-Time passcode</span><button class="ln" id="rs" data-auth="resend" disabled>Resend code</button></div>
<div class="otp rise" style="--i:3">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join("")}</div>
<button class="btn b1 rise" style="--i:4" data-auth="verify">Verify &amp; Log In</button>${typeof AUTH!=="undefined"&&!AUTH.on?`<p class="mut rise" style="--i:4;text-align:center;margin-top:10px">Demo mode: Supabase is not connected, so any code works.</p>`:""}
<p class="mut rise" style="--i:5;text-align:center;margin:14px 0">or sign in with</p>
<button class="btn b3 rise" style="--i:5" data-auth="google">Sign in with Google</button>
<p class="terms rise" style="--i:6">By continuing, you agree to SMART QUEUE’s <button class="lk" data-go="terms">Terms of Service</button> &amp; <button class="lk" data-go="privacy">Privacy Policy</button></p><div class="rise" style="--i:7;text-align:center;margin-top:10px"><button class="ln" data-go="shoplogin">Shopkeeper? Log in here</button></div>`,
home:()=>`<div class="sp rise" style="margin-bottom:12px"><div><p class="mut">Welcome back,</p><h3 style="font-size:17px">${esc(D.user)}</h3></div>${avatar()}</div>
<label class="field rise" style="--i:1">${ic("search",18)}<input id="hs" placeholder="Search hospital, bank, gov offices..." aria-label="Search services"></label>
${heroHtml()}
<button class="btn b2 rise" style="--i:3" data-go="select">Get a Token</button>
<button class="btn b3 rise" style="--i:3;margin-top:10px" data-go="scan">${ic("qr",16)}Scan QR to Join</button>
<h3 class="rise" style="--i:4;margin:18px 0 0">Services Categories</h3><div class="grid">${D.cats.map((c,i)=>`<button class="cat rise" style="--i:${i+5}" data-cat="${c[0]}">${ic(c[1],22)}${c[0]}</button>`).join("")}</div>
<div class="sp rise" style="--i:9"><h3>Nearby Services</h3><span><button class="ln" data-go="map">Live Map</button> <button class="ln" data-go="select">See All</button></span></div>
${nearby()}`,
select:()=>head("Select Service")+locBar()+qBar()+D.svc.map((s,i)=>!selMatch(s)?"":`<div class="card rise" style="--i:${i+1}"><div class="sp"><span class="tag">${s.t}</span>${saveBtn(MS[i+1].code)}</div><h3 style="margin:2px 0 2px">${s.n}</h3><p class="mut">${s.s}</p><p class="mut" style="margin-top:6px">${travelTxt(MS[i+1])}</p><div class="sp" style="margin:12px 0"><div><p class="mut">EST. WAITING TIME</p><b style="font-size:15px">${Math.round(QS[MS[i+1].code].list.length*QS[MS[i+1].code].avg)} min</b></div><div style="text-align:right"><p class="mut">PEOPLE WAITING</p><b style="font-size:15px">${QS[MS[i+1].code].list.length} people</b></div></div><button class="btn b1" data-join="${i}">${ic("ticket",16)}Join Queue</button></div>`).join("")+selEmpty(),
token:()=>{const t=T();return head("Your Digital Token","select")+(!t?emptyCard():`<div class="card big-tok rise" style="--i:1"><div class="live"><i></i>LIVE QUEUE ACTIVE</div><p class="mut">TOKEN NUMBER</p><b>${D.token}</b><p class="mut" style="margin-top:6px">${esc(D.at)}</p>
<div class="sp" style="margin-top:14px"><div><p class="mut">CURRENTLY SERVING</p><b style="font-size:18px;color:var(--green)">${t.serving}</b></div><div><p class="mut">PEOPLE WAITING</p><b style="font-size:18px"><span data-n="${t.ahead}">0</span> ${t.ahead===1?"person":"people"}</b></div></div></div>
<div class="card rise" style="--i:2"><div class="sp"><span class="mut">Estimated waiting time:</span><b style="color:var(--blue)"><span data-n="${t.wait}">0</span> min</b></div><div class="sp" style="margin-top:8px"><span class="mut">Your Progress</span><b style="font-size:12px;color:var(--blue)"><span data-n="${t.prog}">0</span>% Complete</b></div><div class="bar"><i style="width:${t.prog}%"></i></div></div>
${travelCard(t)}
<div class="rise" style="--i:4;display:grid;gap:10px"><button class="btn b1" data-go="live">${ic("pin",16)}Track Live Queue</button><button class="btn b4" data-leave>Leave Queue</button></div>`)},
live:()=>{const t=T();if(!t)return head("Live Queue Tracking","token")+emptyCard();
const w=t.ahead===0?["alert","It is your turn!","Please go to the counter now.",""]:t.ahead<=2?["alert","Your turn is approaching!","Please make your way near the counter.",""]:["info","You are in the queue","We will alert you when your turn is near.","ok"];
const L=t.q.list,i=t.i,it=[];if(i>0)it.push(["done","Token "+L[0],"Currently inside"]);if(i>1)it.push(["done","Token "+L[i-1],"Just ahead of you"]);it.push(["me","Token "+D.token+" (You)",i?"Est. "+t.wait+"m remaining":"Your turn now"]);if(L[i+1])it.push(["","Token "+L[i+1],"Estimated wait: "+Math.round((i+1)*t.q.avg)+"m"]);
return head("Live Queue Tracking","token")+`<div class="warn ${w[3]} rise" style="--i:1">${ic(w[0],18)}<div><b>${w[1]}</b><br>${w[2]}</div></div>
<div class="stats rise" style="--i:2"><div class="card"><p class="mut">YOUR TOKEN</p><b style="color:var(--blue)">${D.token}</b></div><div class="card"><p class="mut">CURRENTLY SERVING</p><b style="color:var(--green)">${t.serving}</b></div><div class="card"><p class="mut">TOKENS AHEAD</p><b><span data-n="${t.ahead}">0</span></b></div></div>
<h3 class="rise" style="--i:3;margin:18px 0 14px">Queue Progression</h3><div class="tl">${it.map((x,k)=>`<div class="it ${x[0]} rise" style="--i:${k+4}"><span class="nd"></span><h3 style="font-size:13px">${x[1]}</h3><p class="mut">${x[2]}</p></div>`).join("")}</div>`},
map:()=>!subOn()?head("Live Map","home")+lockCard("Live map"):head("Live Map","home")+`<div class="mapbox rise" style="--i:1" id="mapbox"></div><div id="msheet"></div>`,
welcome:()=>`<h1 class="big rise">Welcome to Smart Q</h1><p class="mut rise" style="--i:1;margin-bottom:24px">Choose how you want to sign in.</p>
<button class="card role rise" style="--i:2" data-go="login"><span class="ico">${ic("user",22)}</span><span style="flex:1;text-align:left"><h3>I am a customer</h3><p class="mut">Join queues, track your token and get alerts.</p></span>${ic("chev",16)}</button>
<button class="card role rise" style="--i:3" data-go="shoplogin"><span class="ico">${ic("gov",22)}</span><span style="flex:1;text-align:left"><h3>I run a shop</h3><p class="mut">Manage your queue and show your QR code.</p></span>${ic("chev",16)}</button>
<p class="terms rise" style="--i:4">By continuing, you agree to our <button class="lk" data-go="terms">Terms of Service</button> and <button class="lk" data-go="privacy">Privacy Policy</button></p>`,
scan:()=>head("Scan QR Code","home")+`<div class="vf rise" style="--i:1"><video id="scv" playsinline muted></video><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i><i class="sl"></i></div>
<p class="mut rise" id="scst" style="--i:2;text-align:center;margin:12px 0 14px">Scan the QR code at the shop to join its queue.</p>
<div class="rise" style="--i:3;display:grid;gap:10px"><button class="btn b1" data-startscan>${ic("qr",16)}Start camera</button><button class="btn b3" data-photoscan>Scan from photo</button><input type="file" accept="image/*" id="qrf" hidden>

<script>
/* Smart Q authentication (Supabase). Runs after app.js.
   With no config it stays in demo mode and the app behaves as before. */
const CFG = window.SMARTQ_CONFIG || {};
const AUTH = { sb: null, on: false, session: null, role: null, sent: false, busy: false, shopMode: "login" };
try {
  if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient) {
    AUTH.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    AUTH.on = true;
  } else if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) {
    console.error("Supabase settings found, but the supabase-js script did not load. Check your internet connection.");
  }
} catch (e) { console.error("Supabase setup failed", e); }

const aEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const aPhone = v => { const p = v.replace(/[\s()-]/g, ""); return /^\+\d{8,15}$/.test(p) ? p : null; };
const aVal = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const aMsg = e => {
  const m = String((e && e.message) || "");
  if (/rate limit|too many|security purposes/i.test(m)) return "Too many tries. Please wait a minute and try again.";
  if (/token.*(invalid|expired)|(invalid|expired).*(token|otp|code)|otp.*expired/i.test(m)) return "That code is wrong or has expired.";
  if (/invalid login/i.test(m)) return "Wrong email or password.";
  if (/already registered|already exists/i.test(m)) return "That email already has an account. Try logging in.";
  if (/sms|provider.*phone|phone.*provider/i.test(m)) return "Phone codes are not set up yet. Use your email instead.";
  return m || "Something went wrong. Please try again.";
};
const PUBLIC_SCREENS = ["splash", "welcome", "login", "shoplogin", "privacy", "terms", "help"];

function authGuard(id) {
  if (!AUTH.on) return id;
  if (!AUTH.session) return PUBLIC_SCREENS.includes(id) ? id : "welcome";
  if (AUTH.role === "shopkeeper") return ["shop", "privacy", "terms", "help", "splash"].includes(id) ? id : "shop";
  return id === "shop" ? "home" : id;
}
function startScreen() { return AUTH.session ? (AUTH.role === "shopkeeper" ? "shop" : "home") : "welcome"; }

function startResend() {
  clearInterval(timer);
  const b = document.getElementById("rs"); if (!b) return;
  let n = 45; b.disabled = true; b.textContent = "Resend in 45s";
  timer = setInterval(() => { n--; if (n > 0) b.textContent = "Resend in " + n + "s"; else { clearInterval(timer); b.textContent = "Resend code"; b.disabled = false; } }, 1000);
}

async function aProfile(id) {
  const { data, error } = await AUTH.sb.from("profiles").select("role,name,contact").eq("id", id).maybeSingle();
  if (error) throw error;
  return data;
}
function clearLocal() {
  try { localStorage.removeItem("sq_profile"); localStorage.removeItem("sq_uid"); } catch (e) {}
  delete D.photo; D.contact = ""; D.joined = 1; D.completed = 0; D.hist = []; D.saved = []; D.q = "";
  D.set = { alerts: true, theme: "system", mode: "walk" }; D.sub = { status: "none", start: 0, until: 0, auto: true }; M.mode = "walk"; applyTheme();
}
function aLocal(user, prof) {
  let prev = null; try { prev = localStorage.getItem("sq_uid"); } catch (e) {}
  if (prev && prev !== user.id) clearLocal();
  try { localStorage.setItem("sq_uid", user.id); } catch (e) {}
  const fb = String(user.email || user.phone || "").split("@")[0];
  D.user = (prof && prof.name) || fb || "Guest";
  D.contact = (prof && prof.contact) || user.email || user.phone || D.contact;
  save();
}
async function aAfter(kind, session) {
  const s = session || (await AUTH.sb.auth.getSession()).data.session;
  if (!s) throw new Error("Could not sign in. Please try again.");
  AUTH.session = s;
  let prof = await aProfile(s.user.id);
  if (kind === "shopkeeper" && (!prof || prof.role !== "shopkeeper")) {
    const nm = s.user.user_metadata && s.user.user_metadata.shop_name;
    if (nm) {
      const { error } = await AUTH.sb.rpc("create_my_shop", { p_name: nm });
      if (error) throw error;
      prof = await aProfile(s.user.id);
    } else {
      await AUTH.sb.auth.signOut(); AUTH.session = null; AUTH.role = null;
      return toast("No shop account found. Tap Create shop account.");
    }
  }
  if (kind === "customer" && prof && prof.role === "shopkeeper") {
    await AUTH.sb.auth.signOut(); AUTH.session = null; AUTH.role = null;
    return toast("This is a shop account. Use the shopkeeper login.");
  }
  AUTH.role = (prof && prof.role) || "customer";
  AUTH.shopMode = "login";
  aLocal(s.user, prof);
  if (AUTH.role === "customer" && D.sub.status === "none") startTrial();
  go(AUTH.role === "shopkeeper" ? "shop" : "home");
}

async function aSend() {
  const raw = aVal("lg-contact");
  if (!raw) return toast("Enter your phone number or email");
  const em = aEmail(raw), ph = em ? null : aPhone(raw);
  if (!em && !ph) return toast("Enter a valid email, or a phone number with country code, like +91 98765 43210");
  if (!AUTH.on) { AUTH.sent = true; startResend(); return toast("Demo mode: type any 6 digits"); }
  const { error } = await AUTH.sb.auth.signInWithOtp(em ? { email: raw, options: { shouldCreateUser: true } } : { phone: ph });
  if (error) throw error;
  AUTH.sent = true; startResend();
  toast(em ? "Check your email for the code" : "We sent you a code");
}
async function aVerify() {
  if (!AUTH.on) return go("home");
  const raw = aVal("lg-contact"), em = aEmail(raw), ph = em ? null : aPhone(raw);
  if (!em && !ph) return toast("Enter your email or phone number first");
  if (!AUTH.sent) return toast("Tap Send code first");
  const code = [...document.querySelectorAll(".otp input")].map(i => i.value).join("");
  if (!/^\d{6}$/.test(code)) return toast("Enter the 6 digit code");
  const { data, error } = await AUTH.sb.auth.verifyOtp(em ? { email: raw, token: code, type: "email" } : { phone: ph, token: code, type: "sms" });
  if (error) throw error;
  await aAfter("customer", data.session);
}
async function aGoogle() {
  if (!AUTH.on) return toast("Demo mode: Google sign in needs Supabase");

async function aShop() {

  const email = aVal("sl-email"), pass = (document.getElementById("sl-pass") || { value: "" }).value;
  if (!aEmail(email)) return toast("Enter a valid shop email");
  if (pass.length < 8) return toast("Password must be at least 8 characters");
  if (AUTH.shopMode === "signup") {
    const nm = aVal("sl-name");
    if (nm.length < 2) return toast("Enter your shop name");
    const { data, error } = await AUTH.sb.auth.signUp({ email, password: pass, options: { data: { shop_name: nm } } });
    if (error) throw error;
    if (data.session) return aAfter("shopkeeper", data.session);
    AUTH.shopMode = "login"; rerender();
    return toast("Check your email to confirm your account, then log in");
  }
  const { data, error } = await AUTH.sb.auth.signInWithPassword({ email, password: pass });
  if (error) throw error;
  return aAfter("shopkeeper", data.session);
}
async function authSignOut() {
  const kind = cur === "shop" ? "shoplogin" : "login";
  if (AUTH.on) { try { await AUTH.sb.auth.signOut(); } catch (e) {} AUTH.session = null; AUTH.role = null; AUTH.sent = false; }
  AUTH.shopMode = "login";
  go(AUTH.on ? "welcome" : kind);
}
async function authDelete() {
  if (!AUTH.on || !AUTH.session) return resetData();
  const { error } = await AUTH.sb.rpc("delete_my_account");
  if (error) return toast("Could not delete your account. Please try again.");
  try { await AUTH.sb.auth.signOut(); } catch (e) {}
  AUTH.session = null; AUTH.role = null;
  try { localStorage.removeItem("sq_uid"); } catch (e) {}
  resetData();
}
function syncProfile() {
  if (!AUTH.on || !AUTH.session) return;
  AUTH.sb.from("profiles").update({ name: D.user, contact: D.contact }).eq("id", AUTH.session.user.id)
    .then(({ error }) => { if (error) toast("Saved on this device. Could not sync to your account."); });
}
async function authOp(k) {
  if (k === "signout") return authSignOut();
  if (AUTH.busy) return;
  AUTH.busy = true;
  try {
    if (k === "send" || k === "resend") await aSend();
    else if (k === "verify") await aVerify();
    else if (k === "google") await aGoogle();
    else if (k === "shoplogin") await aShop();
    else if (k === "shopmode") { AUTH.shopMode = AUTH.shopMode === "login" ? "signup" : "login"; rerender(); }
  } catch (e) { toast(aMsg(e)); }
  finally { AUTH.busy = false; }
}

V.shoplogin = () => {
  const su = AUTH.shopMode === "signup";
  const lab = (t, i) => `<p class="mut rise" style="--i:${i};margin-bottom:6px;font-weight:600">${t}</p>`;
  return `<button class="ib rise" data-go="welcome" aria-label="Back to role selection">${ic("back")}</button><h1 class="big rise" style="margin-top:20px">${su ? "Create shop account" : "Shopkeeper login"}</h1><p class="mut rise" style="--i:1;margin-bottom:22px">${su ? "Set up your shop to run a queue and show a QR code." : "Sign in to manage your queue, call the next token and see who is waiting."}</p>
${su ? lab("Shop name", 2) + `<label class="field rise" style="--i:2">${ic("gov", 18)}<input id="sl-name" maxlength="60" placeholder="Your shop name" aria-label="Shop name"></label>` : ""}
${lab("Shop email", 2)}<label class="field rise" style="--i:2">${ic("user", 18)}<input id="sl-email" type="email" autocomplete="username" placeholder="you@yourshop.com" aria-label="Shop email"></label>
${lab("Password", 3)}<label class="field rise" style="--i:3">${ic("shield", 18)}<input id="sl-pass" type="password" autocomplete="${su ? "new-password" : "current-password"}" placeholder="At least 8 characters" aria-label="Password"></label>
<button class="btn b1 rise" style="--i:4" data-auth="shoplogin">${su ? "Create account" : "Log In to Dashboard"}</button>
<div class="rise" style="--i:5;text-align:center;margin-top:16px;display:grid;gap:10px"><button class="ln" data-auth="shopmode">${su ? "Already have a shop account? Log in" : "New shop? Create account"}</button><button class="ln" data-go="login">Customer? Log in here</button></div>
${AUTH.on ? "" : `<p class="mut rise" style="--i:5;text-align:center;margin-top:12px">Demo mode: Supabase is not connected, so any email and password opens the dashboard.</p>`}
<p class="terms rise" style="--i:6">By continuing, you agree to our <button class="lk" data-go="terms">Terms of Service</button> and <button class="lk" data-go="privacy">Privacy Policy</button></p>`;
};

if (AUTH.on) {
  AUTH.sb.auth.getSession().then(async ({ data }) => {
    if (data && data.session) {
      AUTH.session = data.session;
      try { const p = await aProfile(data.session.user.id); AUTH.role = (p && p.role) || "customer"; aLocal(data.session.user, p); }
      catch (e) { AUTH.role = "customer"; }
    }
  }).catch(() => {});
  AUTH.sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { AUTH.session = null; AUTH.role = null; const g = authGuard(cur); if (g !== cur) go(g); return; }
    if (ev === "SIGNED_IN" && session && !AUTH.busy && !AUTH.session && ["splash", "welcome", "login", "shoplogin"].includes(cur)) {
      aAfter(cur === "shoplogin" ? "shopkeeper" : "customer", session).catch(e => toast(aMsg(e)));
    }
  });
}
</script>
</body>
